<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#EAF3F5" />
    <meta name="application-name" content="MATE ZONE CHESS ACADEMY" />
    <meta name="apple-mobile-web-app-title" content="MATE ZONE" />
    <title>MATE ZONE CHESS ACADEMY</title>
    <!-- Paint the app background BEFORE the stylesheet loads so the browser
         never shows a white frame between HTML parse and CSS application
         (and again while React hydrates #root). Matches --ink-950, the
         light-theme page background in index.css. -->
    <style>
      html, body, #root { background-color: #EAF3F5; }
    </style>
    <meta
      name="description"
      content="MATE ZONE CHESS ACADEMY is an online chess academy: structured opening courses, live coaching, puzzles, game analysis, tournaments and play against bots."
    />
    <!-- Tab / installed-app icon. These live in public/ rather than src/assets so
         they keep a stable root URL in dev and in the build, which is what a
         manifest must reference; a hashed /assets/ name would break the icon the
         moment the bundle changed. The 48px sheet is what Chrome picks for the
         tab, the 512s for an installed app. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MATE ZONE CHESS ACADEMY" />
    <meta property="og:title" content="MATE ZONE CHESS ACADEMY" />
    <meta
      property="og:description"
      content="Structured opening courses, live coaching, puzzles, game analysis, tournaments and play against bots — all in one place."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MATE ZONE CHESS ACADEMY" />
    <meta
      name="twitter:description"
      content="Structured opening courses, live coaching, puzzles, game analysis, tournaments and play against bots — all in one place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&family=Noto+Serif:wght@600;700&family=Playfair+Display:wght@600;700;800;900&family=Lora:ital,wght@0,400;0,600;0,700;1,600;1,700&family=Lato:wght@400;700;900&family=Orbitron:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('knightpath-theme');
          if (t !== 'light' && t !== 'dark') {
            t = 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
