# Render Blueprint for the MATE ZONE backend.
# Free Web Service (Express + Socket.IO) + external free Neon PostgreSQL.
# Render's own free Postgres expires after 30 days; DATABASE_URL points at Neon.
#
# Create from: Render Dashboard → New → Blueprint → this repository.
# Secret values marked `sync: false` are entered in the Render dashboard.

services:
  - type: web
    name: mate-zone-chess-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && node scripts/bootstrapDb.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Neon pooled connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Paste the exact Cloudflare Pages URL(s) here (comma-separated).
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ANALYSIS_ENGINE_POOL
        value: 1
      # Brevo HTTPS email — no SMTP, no Vercel relay.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: MATE ZONE Chess Academy
      # Cloudinary uploads — Render's disk is temporary.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: mate-zone
      # Optional integrations. Leave blank if unused.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
